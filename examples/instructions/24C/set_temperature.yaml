name: Set temperature
description: Sets the temperature of the specified loop to the specified value.
command:
  format: "LOOP {{loop}}:SETP {{temperature}};CONTROL\n"
  parameters:
    - name: loop
      description: "The loop identification (1 or 2)."
      type: number
      values:
        - 1
        - 2
    - name: temperature
      description: "The temperature value to set for the specified loop."
      type: number