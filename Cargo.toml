[package]
name = "flowlab"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/SamuelHDieterich/flowlab"

[lib]
name = "flowlab"
path = "src/lib.rs"

[[bin]]
name = "flowlab"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.78"
chrono = "0.4.38"
clap = { version = "4.5.3", features = ["cargo", "derive"] }
csv = "1.3.0"
regex = "1.10.5"
serde = { version = "1.0.188", features = ["derive"] }
serde_with = "3.7.0"
serde_yaml = "0.9.25"
tera = "1.19.1"
tokio = { version = "1.33.0", features = ["full"] }
tracing = "0.1.37"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.17", features = ["env-filter", "json"] }
visa-rs = "0.6.1"

[features]
default = ["full"]
full = ["tcp"]
tcp = ["tokio/net"]

[dev-dependencies]
test-log = { version = "0.2.13", default-features = false, features = [
  "trace",
] }
tokio = { version = "1.33.0", features = ["full"] }
tracing-subscriber = { version = "0.3.17", default-features = false, features = [
  "env-filter",
  "fmt",
] }
