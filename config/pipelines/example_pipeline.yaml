name: Example pipeline
description: This pipeline demonstrates how to set the temperature of a 612A and scan the temperature of a 4G device.

devices:
  - path: ../devices/TM612.yaml

pipeline:
  - step: Set display units
    device: TM612A
    parameters:
      - name: units
        value: K
  - step: Set temperature
    device: TM612A
    parameters:
      - name: value
        value: 2
      - name: rate
        value: 10
  - step: Wait for
    metric:
      instruction: Get temperature
      device: TM612A
    parameters:
      name: temperature
      value: 2
      tolerance: 0.1 # absolute tolerance
      delay: 120 # seconds
  - step: Set display units
    device: 4G
    parameters:
      - name: units
        value: T
  - step: Set field
    device: 4G
    parameters:
      - name: value
        value: 0
      - name: unit
        value: T
  - step: Scan
    metric:
      instruction: Set temperature
      device: TM612A
      parameters:
        - name: rate
          value: 10
    type: settle
    parameters:
      variable: value
      start: 2
      stop: 300
      step: 1
    datafile: /tmp/datafile.csv
    measures:
      - instruction: Get temperature
        device: TM612A
