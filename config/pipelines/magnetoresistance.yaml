name: Magnetoresistance
description: Measure the magnetoresistance in different temperatures.

instructions:
  - &SetCurrent
    name: Set current
    command:
      query: "INPUT {{channel}}:CURRENT {{current}}"
      parameters:
        - name: channel
          type: string
        - name: current
          type: float

devices:
  - path: ./config/devices/TM612.yaml
  - name: Resistor
    protocol:
      ip: 192.168.1.10
      port: 1234
    instructions:
      - *SetCurrent

pipeline:
  - step: Set current
    device: Resistor
    parameters:
      - name: channel
        value: A
      - name: current
        value: 50
  - step: Scan
    metrics:
      - step: Set temperature
        device: TM612A
        parameters:
          - name: rate
            value: 0
      - step: Wait for
        metric:
          instruction: Get temperature
          device: TM612A
        parameters:
          name: temperature
          tolerance: 0.02 # K
          delay: 60 # seconds
    type: settle
    parameters:
      variable: temperature
      start: 5
      stop: 300
      step: 5
    measures:
      - step: Scan
        metrics:
          - step: Set field
            device: 4G
            parameters:
              - name: rate
                value: 10
        type: settle
        parameters:
          variable: field
          start: 0
          stop: 20000
          step: 10
        datafile: ../experiment/magnetoresistance-{{DATE}}-{{temperature}}.csv
        measures:
          - step: Get voltage AC/DC
            device: multimeter
            parameters:
              - name: rate
                value: 1
              - name: current
                value: 50
