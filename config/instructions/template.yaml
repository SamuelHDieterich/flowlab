# This is a template for an instruction configuration file. It is used to create new instructions.

# We start a list of instructions. This can be repeated in multiple places and the records will be merged. If the same instruction is defined in multiple places, the last definition will be used.
instructions:
  # The name is used as an identifier for the instruction. It should be unique.
  - name: InstructionName
    # The command is the actual command that will be sent to the device. It is a dictionary with the query and response fields.
    command:
      query: "query {{argument1}} {{argument2}}"
      parameters:
        - name: argument1
          description: Description of argument 1
        - name: argument2
          description: Description of argument 2
    response:
      # The format is a template for the response. It is used to extract the response from the device response.
      format: "{{response_name}}"
      # The parameters are the values that are extracted from the response.
      parameters:
        - name: response_name
          type: response_type
          values:
            - value1
            - value2
          description: Description of response
    # The description is a human-readable description of the instruction. It is optional.
    description: Instruction Description
  # Add more instructions here...
  - ...
